[project]
name = "brain-fm-tui"
version = "0.1.0"
description = "Unofficial Textual player for a Brain.fm subscription. Audio through mpv."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Kang", email = "kangqx@pm.me"}]
readme = "README.md"
dependencies = [
    "dbus-next==0.2.3",
    "textual==8.2.8",
]

[project.scripts]
brain-fm-tui = "brainfm_tui.app:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brainfm_tui"]
